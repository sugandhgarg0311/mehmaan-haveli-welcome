<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32" viewBox="0 0 64 32">
  <!-- Hand block-print border: madder red ground, turmeric triangles, five-petal flowers. -->
  <rect width="64" height="32" fill="#B8322A"/>
  <rect y="0" width="64" height="2" fill="#5C1A1B"/>
  <rect y="30" width="64" height="2" fill="#5C1A1B"/>
  <!-- top sawtooth -->
  <path d="M0 2 L8 9 L16 2 L24 9 L32 2 L40 9 L48 2 L56 9 L64 2 Z" fill="#E3A72F"/>
  <!-- bottom sawtooth -->
  <path d="M0 30 L8 23 L16 30 L24 23 L32 30 L40 23 L48 30 L56 23 L64 30 Z" fill="#E3A72F"/>
  <!-- flower -->
  <g transform="translate(16 16)" fill="#F3E6CC">
    <ellipse rx="2.2" ry="4.2" transform="rotate(0) translate(0 -3.6)"/>
    <ellipse rx="2.2" ry="4.2" transform="rotate(72) translate(0 -3.6)"/>
    <ellipse rx="2.2" ry="4.2" transform="rotate(144) translate(0 -3.6)"/>
    <ellipse rx="2.2" ry="4.2" transform="rotate(216) translate(0 -3.6)"/>
    <ellipse rx="2.2" ry="4.2" transform="rotate(288) translate(0 -3.6)"/>
    <circle r="2" fill="#5C1A1B"/>
  </g>
  <!-- bud between flowers -->
  <g transform="translate(48 16)">
    <path d="M0 -5 C3 -2 3 2 0 5 C-3 2 -3 -2 0 -5 Z" fill="#E3A72F"/>
    <circle r="1.2" fill="#5C1A1B"/>
    <circle cx="-7" r="1" fill="#F3E6CC"/>
    <circle cx="7" r="1" fill="#F3E6CC"/>
  </g>
</svg>
