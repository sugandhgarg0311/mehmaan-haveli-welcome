<svg xmlns="http://www.w3.org/2000/svg" width="48" height="32" viewBox="0 0 48 32">
  <!-- Light Sanganeri-style block-print border: cream ground, soft madder flowers, turmeric scallops, leaf sprigs. -->
  <rect width="48" height="32" fill="#FBF2DE"/>
  <!-- scalloped edges, top and bottom -->
  <path d="M0 2 a3 3 0 0 0 6 0 a3 3 0 0 0 6 0 a3 3 0 0 0 6 0 a3 3 0 0 0 6 0 a3 3 0 0 0 6 0 a3 3 0 0 0 6 0 a3 3 0 0 0 6 0 a3 3 0 0 0 6 0 Z" fill="#EBC164"/>
  <path d="M0 30 a3 3 0 0 1 6 0 a3 3 0 0 1 6 0 a3 3 0 0 1 6 0 a3 3 0 0 1 6 0 a3 3 0 0 1 6 0 a3 3 0 0 1 6 0 a3 3 0 0 1 6 0 a3 3 0 0 1 6 0 Z" fill="#EBC164"/>
  <rect y="0" width="48" height="2" fill="#C2574A"/>
  <rect y="30" width="48" height="2" fill="#C2574A"/>
  <!-- dotted rows -->
  <g fill="#C2574A">
    <circle cx="6" cy="7.6" r="0.7"/><circle cx="18" cy="7.6" r="0.7"/><circle cx="30" cy="7.6" r="0.7"/><circle cx="42" cy="7.6" r="0.7"/>
    <circle cx="6" cy="24.4" r="0.7"/><circle cx="18" cy="24.4" r="0.7"/><circle cx="30" cy="24.4" r="0.7"/><circle cx="42" cy="24.4" r="0.7"/>
  </g>
  <!-- six-petal buti flower -->
  <g transform="translate(12 16)">
    <g fill="#D0644F">
      <ellipse rx="1.9" ry="3.4" transform="rotate(0) translate(0 -3)"/>
      <ellipse rx="1.9" ry="3.4" transform="rotate(60) translate(0 -3)"/>
      <ellipse rx="1.9" ry="3.4" transform="rotate(120) translate(0 -3)"/>
      <ellipse rx="1.9" ry="3.4" transform="rotate(180) translate(0 -3)"/>
      <ellipse rx="1.9" ry="3.4" transform="rotate(240) translate(0 -3)"/>
      <ellipse rx="1.9" ry="3.4" transform="rotate(300) translate(0 -3)"/>
    </g>
    <circle r="2" fill="#E8B04A"/>
    <circle r="0.8" fill="#9C3B30"/>
  </g>
  <!-- leaf sprig with bud -->
  <g transform="translate(36 16)">
    <path d="M0 5 C0 2 0 -2 0 -4" stroke="#8C9A5E" stroke-width="0.8" fill="none"/>
    <path d="M0 2 C-3.5 1.5 -4.5 -1 -4 -2.5 C-2 -2 -0.5 -0.5 0 2 Z" fill="#8C9A5E"/>
    <path d="M0 2 C3.5 1.5 4.5 -1 4 -2.5 C2 -2 0.5 -0.5 0 2 Z" fill="#8C9A5E"/>
    <path d="M0 -6.5 C1.6 -5 1.6 -3.2 0 -2.6 C-1.6 -3.2 -1.6 -5 0 -6.5 Z" fill="#D0644F"/>
  </g>
</svg>
